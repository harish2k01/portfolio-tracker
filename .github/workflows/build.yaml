name: Build Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - package.json
      - package-lock.json
      - next.config.ts
      - postcss.config.mjs
      - prisma.config.ts
      - prisma/**
      - public/**
      - src/**
      - tsconfig.json
      - .github/workflows/build.yaml
      - .github/workflows/release.yaml

permissions:
  contents: read

env:
  # Homelab runners pull Docker Hub images through zot and npm packages through Verdaccio.
  BUILDKIT_MIRROR_CONFIG: |
    [registry."docker.io"]
      mirrors = ["zot.zot.svc.cluster.local:5000"]
    [registry."zot.zot.svc.cluster.local:5000"]
      http = true
  HOMELAB_NPM_REGISTRY: http://verdaccio.verdaccio.svc.cluster.local:4873/
jobs:
  build:
    runs-on: portfolio-tracker-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: ${{ runner.environment == 'self-hosted' && env.BUILDKIT_MIRROR_CONFIG || '' }}

      - name: Build pull request image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted portfolio tracker
          build-args: |
            NPM_CONFIG_REGISTRY=${{ runner.environment == 'self-hosted' && env.HOMELAB_NPM_REGISTRY || 'https://registry.npmjs.org/' }}
